<!DOCTYPE html>

<body class="bg-secondary-subtle">
       <h1 class="text-center py-5">Smart Store Dashboard</h1>
       <section class="form-floating  py-5 border-top w-100 mx-auto d-flex flex-row flex-wrap" id="form" >
           <div class="form-floating w-75 mx-auto my-2 shadow b g-body-tertiary rounded">
               <input type="text" class="form-control" id="productName" placeholder="nameeeeee" required>
               <label for="productName">product Name</label>
            </div>
            <div class="form-floating w-75 mx-auto my-2 shadow bg-body-tertiary rounded">
                <input type="number" class="form-control" id="productPrice" placeholder="Priceee">
                <label for="productPrice">product Price</label>
            </div>
            <div class="form-floating w-75 mx-auto my-2 shadow bg-body-tertiary rounded">
                <input type="text" class="form-control" id="productCategory" placeholder="category">
                <label for="productPrice">product category</label>
            </div>
            <div class="form-floating w-75 mx-auto my-2 shadow bg-body-tertiary rounded">
                <input type="text" class="form-control" id="productDesc" placeholder="desc">
                <label for="productDesc">product Description</label>
            </div>
            <div class="form-floating w-75 mx-auto my-3 d-block">
                <input type="file" class="form-control shadow bg-body-tertiary rounded" id="productImg" placeholder="image">
                <label for="productImg">product image</label>
            </div>
            <div class="w-75 d-flex mx-auto">
                <button class="btn btn-primary" id="addBtn" onclick="addProduct()"> add product</button>
                <button class="btn btn-success px-2 me-2 d-none" id="saveChanges" onclick="saveChanges()">Save changes</button>
                <button class="btn btn-secondary px-2 d-none" id="cancelChanges" onclick="cancelChanges()">Cancel</button>
            </div>
      </section>
        <input type="search" class="form-control shadow w-75 mx-auto mb-3" id="search" placeholder="Search" oninput="search()">
        
        <div class="card-section gap-0 container-xxl m-auto align-items-start d-flex flex-wrap" id="cards-section">
